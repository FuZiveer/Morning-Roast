services:
  - type: web
    name: morning-roast-presence
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PRESENCE_PATH
        value: /presence
      - key: ALLOWED_ORIGINS
        value: https://fuziveer.github.io,http://localhost:5500,http://127.0.0.1:5500
