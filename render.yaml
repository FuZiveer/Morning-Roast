services:
  - type: web
    name: morning-roast-presence
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --prefix server
    startCommand: node server/presence-server.js
    healthCheckPath: /health
    autoDeploy: true
    # Persistent disk keeps chat history, lineup videos, and comments across deploys.
    # Requires a Render plan that supports disks (Starter or higher).
    disk:
      name: morning-roast-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
      - key: PRESENCE_PATH
        value: /presence
      - key: CHAT_PATH
        value: /chat
      - key: CHAT_CONFIG_PATH
        value: config/chat.yaml
      - key: CHAT_HISTORY_PATH
        value: /var/data/chat-history.json
      - key: CHAT_DM_HISTORY_PATH
        value: /var/data/chat-dm-history.json
      - key: LINEUP_SUBMISSIONS_PATH
        value: /var/data/lineup-submissions.json
      - key: LINEUP_UPLOADS_DIR
        value: /var/data/lineup-uploads
      - key: LINEUP_COMMENTS_PATH
        value: /var/data/lineup-comments.json
      - key: ASSISTANT_PATH
        value: /assistant/chat
      - key: POLLINATIONS_MODEL
        value: openai-fast
      - key: ALLOWED_ORIGINS
        value: https://fuziveer.github.io,http://localhost:5500,http://127.0.0.1:5500
