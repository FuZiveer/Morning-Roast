# Render Blueprint — Morning Roast presence WebSocket counter
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy:
# 1. Copy your service URL (e.g. morning-roast-presence.onrender.com)
# 2. Set index.html meta tag:
#    <meta name="morning-roast-presence-ws" content="wss://YOUR-SERVICE.onrender.com/presence" />
# 3. Redeploy GitHub Pages

services:
  - type: web
    name: morning-roast-presence
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PRESENCE_PATH
        value: /presence
      - key: ALLOWED_ORIGINS
        sync: false
        value: https://fuziveer.github.io,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080
